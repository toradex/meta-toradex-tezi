BB_CONF_FRAGMENT_SUMMARY = "Use floating Tezi source revisions"
BB_CONF_FRAGMENT_DESCRIPTION = "Policy for development builds that should track floating Tezi application source revisions."

# Guard the warning because bitbake-config-build parses disabled fragments for metadata.
TDX_FLOATING_TEZI_SOURCES_WARNING := "${@bb.warnonce('Toradex floating Tezi sources are enabled: ' \
						     'qt-tezi and qt-tezictl use AUTOREV. ' \
						     'This build is not reproducible.') \
					 if d.getVar('OE_FRAGMENTS') else ''}"

SRCREV:pn-qt-tezi = "${AUTOREV}"
SRCREV:pn-qt-tezictl = "${AUTOREV}"
